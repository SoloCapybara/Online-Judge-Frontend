                    <th class="sticky top-0 z-10 whitespace-nowrap border-b border-slate-200 bg-slate-50/95 px-3 py-2 text-[0.65rem] font-semibold uppercase tracking-wide text-slate-500 backdrop-blur-sm dark:border-white/[0.06] dark:bg-[#181c2a]/95 dark:text-slate-400">难度</th>

                    <th class="sticky top-0 z-10 min-w-[112px] border-b border-slate-200 bg-slate-50/95 px-3 py-2 text-[0.65rem] font-semibold uppercase tracking-wide text-slate-500 backdrop-blur-sm dark:border-white/[0.06] dark:bg-[#181c2a]/95 dark:text-slate-400">通过率</th>
                    <th class="sticky top-0 z-10 hidden min-w-[8.5rem] whitespace-nowrap border-b border-slate-200 bg-slate-50/95 px-3 py-2 text-[0.65rem] font-semibold uppercase tracking-wide text-slate-500 backdrop-blur-sm dark:border-white/[0.06] dark:bg-[#181c2a]/95 dark:text-slate-400 lg:table-cell">创建者</th>
                    <th class="sticky top-0 z-10 hidden min-w-[10.5rem] border-b border-slate-200 bg-slate-50/95 px-3 py-2 text-[0.65rem] font-semibold uppercase tracking-wide text-slate-500 backdrop-blur-sm dark:border-white/[0.06] dark:bg-[#181c2a]/95 dark:text-slate-400 lg:table-cell">创建 / 更新</th>
                    <th class="sticky top-0 z-10 whitespace-nowrap border-b border-slate-200 bg-slate-50/95 px-3 py-2 text-[0.65rem] font-semibold uppercase tracking-wide text-slate-500 backdrop-blur-sm dark:border-white/[0.06] dark:bg-[#181c2a]/95 dark:text-slate-400">评测</th>
                    <th class="sticky top-0 z-10 hidden whitespace-nowrap border-b border-slate-200 bg-slate-50/95 px-3 py-2 text-[0.65rem] font-semibold uppercase tracking-wide text-slate-500 backdrop-blur-sm dark:border-white/[0.06] dark:bg-[#181c2a]/95 dark:text-slate-400 md:table-cell">状态</th>

  <script src="app-shell.js" defer></script>
  <script>
    (function () {
      var API = "/api/problem/page";
      var USE_NESTED_QUERY = true;

      var state = { current: 1, pageSize: 10, source: "mock" };

      var CATEGORY = { 1: "入门", 2: "动态规划", 3: "图论", 4: "数据结构", 5: "数学", 6: "字符串" };
      var DIFFICULTY = {
        1: { t: "入门", c: "bg-emerald-500/12 text-emerald-800 dark:text-emerald-300" },
        2: { t: "简单", c: "bg-sky-500/12 text-sky-800 dark:text-sky-300" },
        3: { t: "中等", c: "bg-amber-500/12 text-amber-900 dark:text-amber-300" },
        4: { t: "困难", c: "bg-orange-500/12 text-orange-900 dark:text-orange-300" },
        5: { t: "挑战", c: "bg-rose-500/12 text-rose-900 dark:text-rose-300" },
      };
      var PROB_STATUS = { 0: { t: "公开", c: "bg-emerald-500/10 text-emerald-800 dark:text-emerald-400" }, 1: { t: "隐藏", c: "bg-slate-500/15 text-slate-700 dark:text-slate-300" }, 2: { t: "维护", c: "bg-amber-500/15 text-amber-800 dark:text-amber-400" } };

      function escapeHtml(s) {
        if (s == null || s === undefined) return "";
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function fmtPct(n) {
        if (n == null || n === "" || isNaN(Number(n))) return "—";
        var v = Number(n);
        if (v <= 1 && v >= 0) v = v * 100;
        return v.toFixed(1) + "%";
      }

      function fmtTime(iso) {
        if (!iso) return "—";
        try {
          var d = new Date(iso);
          if (isNaN(d.getTime())) return String(iso);
          return d.toLocaleString("zh-CN", { dateStyle: "medium", timeStyle: "short" });
        } catch (e) {
          return String(iso);
        }
      }

      function mockRecords() {
        var titles = [
          ["P1001", "A+B Problem"],
          ["P1048", "采药"],
          ["P3379", "模板 · 最近公共祖先"],
          ["P3384", "重链剖分"],
          ["P2103", "区间 GCD"],
          ["P3842", "树上的路径"],
          ["P2002", "树状数组"],
          ["P3806", "模板 · 点分治"],
          ["P4513", "小白逛公园"],
          ["P4721", "模板 · 支配树"],
          ["P5490", "模板 · 线段树分裂"],
          ["P3203", "弹飞绵羊"],
          ["P3808", "AC 自动机（简单版）"],
          ["P4555", "最长双回文串"],
          ["P4719", "模板 · 矩阵树定理"],
        ];
        var rows = [];
        var base = 1000;
        for (var i = 0; i < titles.length; i++) {
          var id = base + i * 17;
          var cat = (i % 6) + 1;
          var diff = (i % 5) + 1;
          var sub = 800 + i * 133;
          var ac = Math.floor(sub * (0.25 + (i % 7) * 0.08));
          rows.push({
            id: id,
            title: titles[i][0] + " " + titles[i][1],
            categoryId: cat,
            difficulty: diff,
            timeLimit: 1000 + (i % 3) * 500,
            memoryLimit: 128 + (i % 4) * 64,
            judgeMode: i % 2 === 0 ? "OI" : "ACM",
            submitCount: sub,
            acceptCount: ac,
            acceptRate: ac / sub,
            status: i % 9 === 0 ? 1 : 0,
            creatorId: 2038599968272380000 + i,
            createTime: "2024-06-01T08:00:00",
            updateTime: "2026-03-" + ((i % 28) + 1).toString().padStart(2, "0") + "T14:22:00",
          });
        }
        return rows;
      }

      var ALL_MOCK = mockRecords();

      function filterMockRows(q) {
        return ALL_MOCK.filter(function (r) {
          if (q.title && r.title.toLowerCase().indexOf(q.title.toLowerCase()) === -1) return false;
          if (q.categoryId && String(r.categoryId) !== String(q.categoryId)) return false;
          if (q.difficulty !== "" && q.difficulty != null && String(r.difficulty) !== String(q.difficulty)) return false;
          if (q.status !== "" && q.status != null && String(r.status) !== String(q.status)) return false;
          return true;
        });
      }

      function buildQuery(q) {
        var p = new URLSearchParams();
        if (USE_NESTED_QUERY) {
          p.set("queryRequest.current", String(q.current));
          p.set("queryRequest.pageSize", String(q.pageSize));
          if (q.title) p.set("queryRequest.title", q.title);
          if (q.categoryId) p.set("queryRequest.categoryId", String(q.categoryId));
          if (q.difficulty !== "" && q.difficulty != null) p.set("queryRequest.difficulty", String(q.difficulty));
          if (q.status !== "" && q.status != null) p.set("queryRequest.status", String(q.status));
        } else {
          p.set("current", String(q.current));
          p.set("pageSize", String(q.pageSize));
          if (q.title) p.set("title", q.title);
          if (q.categoryId) p.set("categoryId", String(q.categoryId));
          if (q.difficulty !== "" && q.difficulty != null) p.set("difficulty", String(q.difficulty));
          if (q.status !== "" && q.status != null) p.set("status", String(q.status));
        }
        return p.toString();
      }

      function readFilters() {
        var ft = document.getElementById("filterTitle");
        var fc = document.getElementById("filterCategory");
        var fd = document.getElementById("filterDifficulty");
        var fs = document.getElementById("filterStatus");
        return {
          title: ft && ft.value ? ft.value.trim() : "",
          categoryId: fc && fc.value ? fc.value : "",
          difficulty: fd ? fd.value : "",
          status: fs ? fs.value : "",
        };
      }

      function syncHeaderSearch() {
        var h = document.getElementById("headerProblemSearch");
        var ft = document.getElementById("filterTitle");
        if (h && ft) h.value = ft.value;
      }

      function syncFilterFromHeader() {
        var h = document.getElementById("headerProblemSearch");
        var ft = document.getElementById("filterTitle");
        if (h && ft) ft.value = h.value;
      }

      function renderRows(records) {
        var tb = document.getElementById("problemTableBody");
        if (!tb) return;
        tb.innerHTML = "";
        records.forEach(function (r) {
          var tr = document.createElement("tr");
          tr.className = "transition hover:bg-violet-500/[0.04] dark:hover:bg-white/[0.03]";
          var diff = DIFFICULTY[r.difficulty] || { t: "—", c: "bg-slate-500/10 text-slate-600 dark:text-slate-400" };
          var cat = CATEGORY[r.categoryId] || "—";
          var st = PROB_STATUS[r.status] || PROB_STATUS[0];
          var pct = fmtPct(r.acceptRate);
          var barW = 0;
          if (r.acceptRate != null && !isNaN(Number(r.acceptRate))) {
            var raw = Number(r.acceptRate);
            if (raw >= 0 && raw <= 1) barW = Math.min(100, Math.round(raw * 100));
            else barW = Math.min(100, Math.round(raw));
          }
          tr.innerHTML =
            '<td class="whitespace-nowrap px-3 py-2 font-mono text-[0.8rem] text-slate-500 dark:text-slate-400">' +
            escapeHtml(r.id) +
            "</td>" +
            '<td class="max-w-[min(360px,40vw)] px-3 py-2">' +
            '<a href="problem.html?id=' +
            encodeURIComponent(String(r.id)) +
            '" class="font-medium text-violet-700 underline-offset-4 transition hover:text-violet-600 hover:underline dark:text-violet-300 dark:hover:text-violet-200">' +
            escapeHtml(r.title) +
            "</a></td>" +
            '<td class="whitespace-nowrap px-3 py-2 text-slate-600 dark:text-slate-300">' +
            escapeHtml(cat) +
            "</td>" +
            '<td class="whitespace-nowrap px-3 py-2"><span class="inline-flex rounded-md px-2 py-0.5 text-xs font-semibold ' +
            diff.c +
            '">' +
            escapeHtml(diff.t) +
            "</span></td>" +
            '<td class="whitespace-nowrap px-3 py-2 font-mono text-[0.75rem] text-slate-500 dark:text-slate-400">' +
            escapeHtml(r.timeLimit) +
            " ms · " +
            escapeHtml(r.memoryLimit) +
            " MB</td>" +
            '<td class="whitespace-nowrap px-3 py-2 font-mono text-[0.75rem] tabular-nums">' +
            escapeHtml(r.submitCount) +
            " / " +
            escapeHtml(r.acceptCount) +
            "</td>" +
            '<td class="px-3 py-2">' +
            '<div class="flex items-center gap-2">' +
            '<div class="h-1.5 flex-1 overflow-hidden rounded-full bg-slate-200 dark:bg-white/10" title="' +
            escapeHtml(pct) +
            '">' +
            '<div class="h-full rounded-full bg-gradient-to-r from-violet-500 to-sky-500" style="width:' +
            barW +
            '%"></div></div>' +
            '<span class="w-12 shrink-0 text-right font-mono text-xs text-slate-600 dark:text-slate-400">' +
            escapeHtml(pct) +
            "</span></div></td>" +
            '<td class="hidden max-w-[9rem] truncate px-3 py-2 font-mono text-[0.65rem] text-slate-600 dark:text-slate-300 lg:table-cell" title="' +
            escapeHtml(r.creatorId != null ? String(r.creatorId) : "") +
            '">' +
            escapeHtml(r.creatorId != null ? String(r.creatorId) : "—") +
            "</td>" +
            '<td class="hidden min-w-[10rem] px-3 py-2 text-[0.65rem] leading-snug text-slate-600 dark:text-slate-300 lg:table-cell">' +
            '<div class="space-y-0.5">' +
            '<div><span class="text-slate-400 dark:text-slate-500">创建</span> ' +
            escapeHtml(fmtTime(r.createTime)) +
            "</div>" +
            '<div><span class="text-slate-400 dark:text-slate-500">更新</span> ' +
            escapeHtml(fmtTime(r.updateTime)) +
            "</div></div></td>" +
            '<td class="whitespace-nowrap px-3 py-2 font-mono text-xs text-slate-500 dark:text-slate-400">' +
            escapeHtml(r.judgeMode || "—") +
            "</td>" +
            '<td class="hidden whitespace-nowrap px-3 py-2 md:table-cell"><span class="inline-flex rounded-md px-2 py-0.5 text-xs font-semibold ' +
            st.c +
            '">' +
            escapeHtml(st.t) +
            "</span></td>";
          tb.appendChild(tr);
        });
      }

      function renderPagination(data) {
        var nav = document.getElementById("problemPagination");
        if (!nav) return;
        var cur = Number(data.current) || 1;
        var total = Number(data.total) || 0;
        var size = Number(data.size) || state.pageSize;
        var pages = Number(data.pages) || Math.ceil(total / size) || 1;
        var start = total === 0 ? 0 : (cur - 1) * size + 1;
        var end = Math.min(cur * size, total);
        nav.innerHTML = "";
        var left = document.createElement("div");
        left.className = "flex flex-wrap items-baseline gap-x-2 gap-y-1 text-sm text-slate-600 dark:text-slate-300";
        if (total > 0) {
          left.innerHTML =
            '<span>共 <strong class="font-semibold tabular-nums text-slate-900 dark:text-slate-100">' +
            total.toLocaleString() +
            "</strong> 条</span>" +
            '<span class="text-slate-300 dark:text-slate-600">·</span>' +
            '<span>共 <strong class="font-semibold tabular-nums text-slate-900 dark:text-slate-100">' +
            pages +
            "</strong> 页</span>" +
            '<span class="text-slate-300 dark:text-slate-600">·</span>' +
            "<span>第 " +
            start +
            "–" +
            end +
            " 条</span>";
        } else {
          left.innerHTML = '<span class="text-slate-500 dark:text-slate-400">共 <strong class="tabular-nums">0</strong> 条</span>';
        }
        if (state.source === "mock") {
          var note = document.createElement("span");
          note.className = "ml-0 w-full text-xs text-slate-400 sm:ml-2 sm:w-auto dark:text-slate-500";
          note.textContent = "（演示数据）";
          left.appendChild(note);
        }
        nav.appendChild(left);

        var wrap = document.createElement("div");
        wrap.className = "flex flex-wrap items-center justify-center gap-1 sm:justify-end";

        function addBtn(label, disabled, page, primary) {
          var b = document.createElement("button");
          b.type = "button";
          b.textContent = label;
          b.disabled = !!disabled;
          b.className =
            "min-w-[2.25rem] rounded-lg border px-2.5 py-1.5 text-sm font-medium transition " +
            (primary
              ? "border-violet-500/40 bg-violet-500/10 text-violet-800 dark:text-violet-200"
              : "border-slate-200 bg-white text-slate-700 hover:bg-slate-50 dark:border-white/10 dark:bg-[#181c2a] dark:text-slate-200 dark:hover:bg-white/[0.06]") +
            (disabled ? " cursor-not-allowed opacity-40" : "");
          if (!disabled && page != null) {
            b.addEventListener("click", function () {
              state.current = page;
              load();
            });
          }
          return b;
        }

        wrap.appendChild(addBtn("上一页", cur <= 1, cur - 1, false));
        var windowSize = 5;
        var from = Math.max(1, cur - Math.floor(windowSize / 2));
        var to = Math.min(pages, from + windowSize - 1);
        from = Math.max(1, to - windowSize + 1);
        for (var p = from; p <= to; p++) {
          wrap.appendChild(addBtn(String(p), false, p, p === cur));
        }
        wrap.appendChild(addBtn("下一页", cur >= pages, cur + 1, false));
        nav.appendChild(wrap);
      }

      function showLoading(on) {
        var el = document.getElementById("problemListLoading");
        if (!el) return;
        el.classList.toggle("hidden", !on);
        el.classList.toggle("flex", on);
      }

      function showError(msg) {
        var el = document.getElementById("problemListError");
        if (!el) return;
        if (msg) {
          el.textContent = msg;
          el.classList.remove("hidden");
        } else el.classList.add("hidden");
      }

      function load() {
        var filters = readFilters();
        var q = Object.assign({ current: state.current, pageSize: state.pageSize }, filters);
        showError("");
        showLoading(true);
        var url = API + "?" + buildQuery(q);

        fetch(url, { credentials: "same-origin" })
          .then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.json();
          })
          .then(function (body) {
            if (body.code !== 0 && body.code !== undefined) throw new Error(body.message || "业务错误");
            var data = body.data;
            if (!data || !data.records) throw new Error("响应格式异常");
            state.source = "api";
            renderPageData(data);
          })
          .catch(function () {
            state.source = "mock";
            var filtered = filterMockRows(filters);
            var total = filtered.length;
            var size = state.pageSize;
            var pages = Math.max(1, Math.ceil(total / size));
            if (state.current > pages) state.current = pages;
            var start = (state.current - 1) * size;
            var slice = filtered.slice(start, start + size);
            renderPageData({
              current: state.current,
              total: total,
              size: size,
              pages: pages,
              records: slice,
            });
          })
          .finally(function () {
            showLoading(false);
          });
      }

      function renderPageData(data) {
        var records = data.records || [];
        var empty = document.getElementById("problemListEmpty");
        if (empty) empty.classList.toggle("hidden", records.length > 0);
        renderRows(records);
        renderPagination(data);
      }

      var form = document.getElementById("problemFilters");
      if (form) {
        form.addEventListener("submit", function (e) {
          e.preventDefault();
          state.current = 1;
          syncHeaderSearch();
          load();
        });
      }

      var resetBtn = document.getElementById("filterReset");
      if (resetBtn) {
        resetBtn.addEventListener("click", function () {
          ["filterTitle", "filterCategory", "filterDifficulty", "filterStatus"].forEach(function (id) {
            var el = document.getElementById(id);
            if (!el) return;
            if (el.tagName === "SELECT") el.selectedIndex = 0;
            else el.value = "";
          });
          var h = document.getElementById("headerProblemSearch");
          if (h) h.value = "";
          state.current = 1;
          load();
        });
      }

      var hs = document.getElementById("headerProblemSearch");
      if (hs) {
        hs.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            e.preventDefault();
            syncFilterFromHeader();
            state.current = 1;
            load();
          }
        });
      }

      load();
    })();
  </script>
</body>
</html>
